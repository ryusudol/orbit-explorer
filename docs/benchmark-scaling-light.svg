<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<rect width="900" height="380" rx="10" fill="#fcfcfb"/>
<text x="24" y="34" font-size="16" font-weight="600" fill="#0b0b0b">Conjunction sieve: every pair closer than 10 km, one instant</text>
<text x="24" y="56" font-size="12.5" fill="#52514e">Native, Apple M1, single thread. At 100k objects the hash is 274× faster (28.3 ms vs 7.7 s). Both return identical pairs.</text>
<line x1="70" x2="750" y1="306.5" y2="306.5" stroke="#e1e0d9"/><text x="62" y="310.5" text-anchor="end" font-size="11" fill="#898781">1 ms</text><line x1="70" x2="750" y1="255.5" y2="255.5" stroke="#e1e0d9"/><text x="62" y="259.5" text-anchor="end" font-size="11" fill="#898781">10 ms</text><line x1="70" x2="750" y1="203.5" y2="203.5" stroke="#e1e0d9"/><text x="62" y="207.5" text-anchor="end" font-size="11" fill="#898781">100 ms</text><line x1="70" x2="750" y1="151.5" y2="151.5" stroke="#e1e0d9"/><text x="62" y="155.5" text-anchor="end" font-size="11" fill="#898781">1 s</text><line x1="70" x2="750" y1="100.5" y2="100.5" stroke="#e1e0d9"/><text x="62" y="104.5" text-anchor="end" font-size="11" fill="#898781">10 s</text><path d="M126.032,207.427L401.897,160.741L704.218,105.317" fill="none" stroke="#eb6834" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="126.03205392274636" cy="207.42709126597714" r="4.5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><circle cx="401.897086258651" cy="160.74070271233643" r="4.5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><circle cx="704.2184784575159" cy="105.31664702054593" r="4.5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><line x1="712.2184784575159" x2="726.2184784575159" y1="105.31664702054593" y2="105.31664702054593" stroke="#eb6834" stroke-width="2"/><text x="732.2184784575159" y="109.31664702054593" font-size="12" fill="#0b0b0b">all pairs, O(N²)</text><path d="M126.032,290.441L401.897,259.305L704.218,231.377" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="126.03205392274636" cy="290.4411472246637" r="4.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><circle cx="401.897086258651" cy="259.30503031048426" r="4.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><circle cx="704.2184784575159" cy="231.37680746820462" r="4.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><line x1="712.2184784575159" x2="726.2184784575159" y1="231.37680746820462" y2="231.37680746820462" stroke="#2a78d6" stroke-width="2"/><text x="732.2184784575159" y="235.37680746820462" font-size="12" fill="#0b0b0b">spatial hash, O(N)</text><text x="126.03205392274636" y="340" text-anchor="middle" font-size="11" fill="#898781">10k objects</text><text x="401.897086258651" y="340" text-anchor="middle" font-size="11" fill="#898781">30k objects</text><text x="704.2184784575159" y="340" text-anchor="middle" font-size="11" fill="#898781">100k objects</text>
</svg>
