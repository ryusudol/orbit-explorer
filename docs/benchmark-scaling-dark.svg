<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<rect width="900" height="380" rx="10" fill="#1a1a19"/>
<text x="24" y="34" font-size="16" font-weight="600" fill="#ffffff">Conjunction sieve: every pair closer than 10 km, one instant</text>
<text x="24" y="56" font-size="12.5" fill="#c3c2b7">Native, Apple M1, single thread. At 100k objects the hash is 305× faster (19.2 ms vs 5.9 s). Both return identical pairs.</text>
<line x1="70" x2="750" y1="306.5" y2="306.5" stroke="#2c2c2a"/><text x="62" y="310.5" text-anchor="end" font-size="11" fill="#898781">1 ms</text><line x1="70" x2="750" y1="255.5" y2="255.5" stroke="#2c2c2a"/><text x="62" y="259.5" text-anchor="end" font-size="11" fill="#898781">10 ms</text><line x1="70" x2="750" y1="203.5" y2="203.5" stroke="#2c2c2a"/><text x="62" y="207.5" text-anchor="end" font-size="11" fill="#898781">100 ms</text><line x1="70" x2="750" y1="151.5" y2="151.5" stroke="#2c2c2a"/><text x="62" y="155.5" text-anchor="end" font-size="11" fill="#898781">1 s</text><line x1="70" x2="750" y1="100.5" y2="100.5" stroke="#2c2c2a"/><text x="62" y="104.5" text-anchor="end" font-size="11" fill="#898781">10 s</text><path d="M126.032,215.219L401.897,165.793L704.218,111.586" fill="none" stroke="#d95926" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="126.03205392274636" cy="215.21906668094894" r="4.5" fill="#d95926" stroke="#1a1a19" stroke-width="2"/><circle cx="401.897086258651" cy="165.7930842359735" r="4.5" fill="#d95926" stroke="#1a1a19" stroke-width="2"/><circle cx="704.2184784575159" cy="111.58606611953394" r="4.5" fill="#d95926" stroke="#1a1a19" stroke-width="2"/><line x1="712.2184784575159" x2="726.2184784575159" y1="111.58606611953394" y2="111.58606611953394" stroke="#d95926" stroke-width="2"/><text x="732.2184784575159" y="115.58606611953394" font-size="12" fill="#ffffff">all pairs, O(N²)</text><path d="M126.032,296.444L401.897,265.686L704.218,240.094" fill="none" stroke="#3987e5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="126.03205392274636" cy="296.44431545916194" r="4.5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><circle cx="401.897086258651" cy="265.68568576239176" r="4.5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><circle cx="704.2184784575159" cy="240.09403650493007" r="4.5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><line x1="712.2184784575159" x2="726.2184784575159" y1="240.09403650493007" y2="240.09403650493007" stroke="#3987e5" stroke-width="2"/><text x="732.2184784575159" y="244.09403650493007" font-size="12" fill="#ffffff">spatial hash, O(N)</text><text x="126.03205392274636" y="340" text-anchor="middle" font-size="11" fill="#898781">10k objects</text><text x="401.897086258651" y="340" text-anchor="middle" font-size="11" fill="#898781">30k objects</text><text x="704.2184784575159" y="340" text-anchor="middle" font-size="11" fill="#898781">100k objects</text>
</svg>
