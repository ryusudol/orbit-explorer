name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The tests read the snapshots, which aren't in git. CelesTrak's CSVs carry
      # over between runs, so it's only asked again once they're 2 hours old.
      - uses: actions/cache@v4
        with:
          # GP CSVs, plus JPL's moon rosters (30 days) and the irregular moons' elements (7 days)
          path: |
            data/cache/*.csv
            data/cache/horizons
          key: gp-${{ github.run_id }}
          restore-keys: gp-
      - name: Fetch snapshots
        run: pnpm data

      # Engine: Vallado verification set, frames, Sun, grid-vs-brute-force,
      # +Grid topology, step-size independence of the conjunction sieve
      - name: cargo test
        run: cargo test --release --manifest-path engine/Cargo.toml

      - name: Build WASM
        run: pnpm engine:build

      - name: Typecheck
        run: pnpm --filter web typecheck

      # Web: snapshot decoding, Hermite interpolation error, satellite.js cross-check,
      # planets and moons against JPL Horizons, flights out to the Oort cloud
      - name: vitest
        run: WRITE_VALIDATION=1 pnpm --filter web test

      - name: Validation plots
        run: |
          cargo run --release --manifest-path engine/Cargo.toml --example validate -- docs/validation/vallado-errors.csv
          pnpm --filter web plots

      - name: Build site
        run: pnpm --filter web build

      - uses: actions/upload-artifact@v4
        with:
          name: validation
          path: |
            docs/validation/*.svg
            docs/validation/*.csv
            docs/*.svg
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/dist
