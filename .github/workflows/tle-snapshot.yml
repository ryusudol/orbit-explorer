name: TLE snapshot

# Refresh the catalogue snapshot once a day. The demo only ever loads this
# file; it never calls CelesTrak at runtime (CelesTrak asks clients not to
# re-download unchanged data, and throttles those that do).

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch GP elements and build catalog.bin
        env:
          # Optional: with a Space-Track account the full public catalogue (~30k) is used.
          SPACETRACK_USER: ${{ secrets.SPACETRACK_USER }}
          SPACETRACK_PASS: ${{ secrets.SPACETRACK_PASS }}
        run: node data/fetch-tles.mjs

      - name: Commit if changed
        run: |
          git config user.name "orbit-explorer-bot"
          git config user.email "orbit-explorer-bot@users.noreply.github.com"
          git add web/public/data/catalog.bin web/public/data/catalog.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "data: catalogue snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
