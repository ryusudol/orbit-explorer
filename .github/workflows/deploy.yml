name: Deploy

# Cloudflare Pages, because the page must be cross-origin isolated
# (COOP/COEP headers, see web/public/_headers) for SharedArrayBuffer, which
# GitHub Pages cannot serve. Needs repository secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID.
#
# The catalogue and ephemeris snapshots aren't in git: every deploy fetches
# them, and a scheduled deploy every 6 hours keeps them current. SGP4 from
# TLEs is good to ~1 km at epoch and drifts by a few km per day, so a few
# hours' extra age is invisible in the scene; new launches still appear the
# same day. The ephemeris covers 10 days ahead. The demo never calls CelesTrak or Horizons
# at runtime. If a fetch fails, the job fails and the last deployment stays up.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # CelesTrak's CSVs carry over between runs, so a push soon after a
      # scheduled deploy reuses them instead of asking again
      - uses: actions/cache@v4
        with:
          # GP CSVs, plus JPL's moon rosters (30 days) and the irregular moons' elements (7 days)
          path: |
            data/cache/*.csv
            data/cache/horizons
          key: gp-${{ github.run_id }}
          restore-keys: gp-
      - name: Fetch GP elements, JPL Horizons trajectories and the Kuiper belt
        env:
          # Optional: with a Space-Track account the full public catalogue (~30k) is used.
          SPACETRACK_USER: ${{ secrets.SPACETRACK_USER }}
          SPACETRACK_PASS: ${{ secrets.SPACETRACK_PASS }}
        run: pnpm data

      - run: pnpm build

      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set; skipping deploy."
            exit 0
          fi
          npx --yes wrangler@4 pages deploy web/dist --project-name=orbit-explorer --branch=main
